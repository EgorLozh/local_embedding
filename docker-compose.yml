services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-cpu-1.9}
    container_name: local-embedding-tei
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/data
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-BAAI/bge-m3}
      - --max-batch-tokens
      - "${TEI_MAX_BATCH_TOKENS:-16384}"
      - --max-concurrent-requests
      - "${TEI_MAX_CONCURRENT_REQUESTS:-512}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - embedding-net

  api:
    build: .
    container_name: local-embedding-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      VLLM_BASE_URL: http://tei:80
    depends_on:
      tei:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - embedding-net

networks:
  embedding-net:
    driver: bridge
